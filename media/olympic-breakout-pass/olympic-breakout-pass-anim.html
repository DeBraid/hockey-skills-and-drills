.drill{display:block;width:100%;height:auto;max-height:calc(100vh - 60px);font-family:ui-rounded,"SF Pro Rounded",Nunito,"Segoe UI",system-ui,-apple-system,Roboto,sans-serif}

.drill.paused .a{animation-play-state:paused}.drill.reset .a{animation:none!important}
